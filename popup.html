<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Cat Break</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 300px;
    font-family: 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif;
    background: linear-gradient(160deg, #FFD1DC 0%, #E6E6FA 100%);
    color: #2D3748;
    padding: 16px;
  }

  .container {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 8px 20px rgba(45, 55, 72, 0.15);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #2D3748;
    letter-spacing: 0.3px;
  }

  .status-card {
    background: #E6E6FA;
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    margin-bottom: 14px;
    box-shadow: inset 0 0 0 1px rgba(45, 55, 72, 0.06);
  }

  .status-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #6B7280;
    margin-bottom: 4px;
  }

  .status-timer {
    font-size: 28px;
    font-weight: 800;
    color: #2D3748;
  }

  .status-state {
    margin-top: 4px;
    font-size: 12px;
    color: #6B7280;
  }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: #2D3748;
    margin-bottom: 8px;
    margin-top: 14px;
  }

  .interval-group {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }

  .interval-btn {
    flex: 1;
    background: #FFF0F5;
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 600;
    color: #2D3748;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .interval-btn:hover {
    background: #FFD1DC;
  }

  .interval-btn.active {
    background: #FFD1DC;
    border-color: #2D3748;
  }

  .btn {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 10px rgba(45, 55, 72, 0.15);
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background: #FFD1DC;
    color: #2D3748;
  }

  .btn-primary:hover {
    background: #ffc0d0;
  }

  .btn-primary.paused {
    background: #E6E6FA;
  }

  .btn-secondary {
    background: #2D3748;
    color: #FFF0F5;
  }

  .btn-secondary:hover {
    background: #3d4a5f;
  }

  footer {
    text-align: center;
    margin-top: 14px;
    font-size: 10px;
    color: #9CA3AF;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Cute Cat Break 🐾</h1>
    </header>

    <div class="status-card">
      <div class="status-label">Next break in</div>
      <div class="status-timer" id="timerDisplay">30:00</div>
      <div class="status-state" id="stateDisplay">Paused</div>
    </div>

    <div class="section-title">Break Interval</div>
    <div class="interval-group">
      <button class="interval-btn" data-minutes="10">10 min</button>
      <button class="interval-btn" data-minutes="20">20 min</button>
      <button class="interval-btn active" data-minutes="30">30 min</button>
    </div>

    <button class="btn btn-primary" id="toggleBtn">Start ▶️</button>
    <button class="btn btn-secondary" id="summonBtn">Summon Cat Now 🐈</button>

    <footer>made with love for your eyes 👀💗</footer>
  </div>

<script src="popup.js"></script>
</body>
</html>
